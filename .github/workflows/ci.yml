name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: unit tests
        run: npm run test

      - name: e2e tests
        run: npm run test:e2e

      - name: scan secrets (gitleaks)
        run: npm run scan:secrets

      - name: scan deps (npm audit)
        run: npm run scan:deps

      - name: scan rls
        run: npm run scan:rls

      - name: scan tenant id
        run: npm run scan:tenant

      - name: scan forbidden terms
        run: npm run scan:forbidden

      - name: scan i18n
        run: npm run scan:i18n
